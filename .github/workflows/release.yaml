name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (for example v1.1.0)'
        required: false

permissions:
  contents: write

concurrency:
  group: central-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release tag points to central branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin central --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/central || {
            echo "Tag commit is not on origin/central. Central releases must be cut from central branch." >&2
            exit 1
          }

      - name: Extract version from tag
        id: v
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}"
          if [[ -z "$TAG" ]]; then
            echo "No tag available. Provide one via workflow_dispatch input 'tag' (for example v1.1.0)." >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Failed to derive release version from tag '$TAG'." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" | tee -a "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java and Maven (Central + GPG)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set pom version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${{ steps.v.outputs.VERSION }}" -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Must not be a SNAPSHOT
        shell: bash
        run: |
          VER=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$VER" == *-SNAPSHOT ]]; then
            echo "SNAPSHOT is not allowed in Maven Central releases."
            exit 1
          fi

      - name: Build, sign, and publish to Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -Pdeployment -B -ntp clean deploy
